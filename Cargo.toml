[workspace]
resolver = "2"
members = ["crates/basecamp-core", "crates/basecamp-hid", "crates/basecampd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
